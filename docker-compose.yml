services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corrective-rag-app
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - GROQ_TEMPERATURE=${GROQ_TEMPERATURE:-0.0}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-bge-m3:latest}
      - OLLAMA_BASE_URL=http://ollama:11434
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - VECTORSTORE_PATH=/app/data/faiss_index
    volumes:
      - faiss_data:/app/data/faiss_index
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: corrective-rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  faiss_data:
  ollama_models:
